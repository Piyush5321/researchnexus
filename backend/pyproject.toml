[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-nexus-backend"
version = "1.0.0"
description = "FastAPI Backend for ResearchNexus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[tool.vercel]
entrypoint = "main.py:app"
